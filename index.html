function chk(){var b=document.querySelector('.boot');if(!b)return;var ok=!!window.SDBE_DEBUG;
var why=ok?'Skrip utama berjalan tetapi belum menampilkan halaman (kemungkinan server lambat/terblokir).':'Skrip utama TIDAK berjalan. Biasanya karena berkas HTML terpotong saat ditempel, ada berkas yang belum dibuat, atau deployment masih versi lama.';
b.innerHTML='<div style="max-width:520px;padding:22px;font:14px system-ui,sans-serif;color:#13221a"><div style="font-size:30px">⚠️</div><h3 style="margin:6px 0">Aplikasi belum dapat dimuat</h3><p>'+why+'</p>'+(E.length?'<pre style="white-space:pre-wrap;background:#fdecec;color:#b91c1c;padding:8px;border-radius:8px;font-size:12px">'+esc(E.slice(0,4).join('\n'))+'</pre>':'')+'<p style="font-size:12.5px;color:#5d6e65">Versi halaman: <b>'+V+'</b>. Pastikan: (1) semua berkas HTML dari folder 01_KLIEN sudah dibuat dengan nama persis sama, (2) isi ditempel utuh, (3) Terapkan › Kelola deployment › edit › <b>Versi baru</b>, (4) buka URL /exec lalu tekan Ctrl+F5.</p><button onclick="location.reload()" style="padding:9px 16px;border:0;border-radius:9px;background:#166534;color:#fff;font-weight:700">Muat ulang</button> <button onclick="try{localStorage.clear()}catch(x){};location.reload()" style="padding:9px 16px;border:1px solid #ccc;border-radius:9px;background:#fff">Reset sesi</button></div>';}
setTimeout(chk,12000);})();

<style>
:root{
  --bg:#f3f6f4;--surface:#ffffff;--surface-2:#f8faf9;--border:#e1e8e4;--border-strong:#cdd8d2;
  --text:#0f1d16;--muted:#5d6e65;--faint:#8a9a91;
  --brand:#166534;--brand-600:#15803d;--brand-700:#14532d;--brand-50:#ecf7ef;--brand-100:#d4eedb;--on-brand:#ffffff;
  --earth:#a6551c;--earth-50:#fbf1e8;
  --ok:#15803d;--ok-bg:#e7f6ec;--warn:#b45309;--warn-bg:#fdf3e3;--bad:#b91c1c;--bad-bg:#fdecec;--info:#1d4ed8;--info-bg:#e8eefd;
  --shadow:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);--shadow-lg:0 18px 48px rgba(10,30,20,.18);
  --radius:12px;--radius-sm:8px;--header-h:60px;--side-w:252px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a120e;--surface:#101a15;--surface-2:#0d1612;--border:#1e2b25;--border-strong:#2a3a32;
  --text:#e5eee8;--muted:#98a89f;--faint:#6f8077;
  --brand:#22a356;--brand-600:#2fb565;--brand-700:#4ade80;--brand-50:#11261a;--brand-100:#173522;--on-brand:#04130a;
  --earth:#e08a4a;--earth-50:#2a1b10;
  --ok:#4ade80;--ok-bg:#10281a;--warn:#f0a24a;--warn-bg:#2c1f0d;--bad:#f87171;--bad-bg:#2d1414;--info:#8ab4ff;--info-bg:#121e36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);--shadow-lg:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--brand-600)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.sm{width:15px;height:15px}svg.i.lg{width:22px;height:22px}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:40;height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.hdr .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand),var(--brand-700));color:#fff;overflow:hidden;cursor:zoom-in;border:1px solid var(--border)}
:root[data-theme="dark"] .logo{background:linear-gradient(145deg,#166534,#0b3d20)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-txt{min-width:0}
.brand-title{font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-pen{opacity:.55;cursor:pointer;border:0;background:none;padding:2px;border-radius:6px;color:var(--muted)}
.edit-pen:hover{opacity:1;background:var(--surface-2)}
.hdr-scope{display:flex;gap:8px;align-items:center}
.hdr-scope select{max-width:220px}
.hdr-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--earth);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;background:var(--surface)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off::before{background:var(--bad)}.net.sync::before{background:var(--warn)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.xl{width:96px;height:96px;font-size:30px;cursor:zoom-in}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:30px;padding:3px 10px 3px 3px;cursor:pointer;background:var(--surface)}
.user-chip .nm{font-size:12.5px;font-weight:600;line-height:1.1;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .rl{font-size:10.5px;color:var(--muted)}
.menu{position:absolute;right:12px;top:calc(var(--header-h) - 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:240px;padding:6px;z-index:60}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}
.side{width:var(--side-w);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 10px 20px;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow:auto}
.side .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--text);font-weight:500;text-align:left}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--brand-50);color:var(--brand-700);font-weight:700}
.nav.on svg{color:var(--brand-600)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:0 7px;font-weight:700}
.side-foot{margin:18px 10px 0;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
main{flex:1;min-width:0;padding:22px 26px 40px;max-width:1560px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:21px;margin:0;letter-spacing:-.01em}
.page-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.bnav{display:none}
.drawer-mask{display:none}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.kpi{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-600);flex:none}
.kpi .ic.earth{background:var(--earth-50);color:var(--earth)}.kpi .ic.info{background:var(--info-bg);color:var(--info)}.kpi .ic.bad{background:var(--bad-bg);color:var(--bad)}
.kpi .v{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}

/* ---------- Buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--text);min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-600)}
.btn.earth{background:var(--earth);border-color:var(--earth);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 7px;min-height:26px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Forms ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.f.full{grid-column:1/-1}
.inp,select.inp,textarea.inp{width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);min-height:38px;font-size:13.5px;font-weight:500;color:var(--text)}
textarea.inp{min-height:80px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:0;border-color:var(--brand)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.help{font-size:11.5px;color:var(--faint);font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand)}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;max-height:160px;overflow:auto}
.search{position:relative}
.search svg{position:absolute;left:10px;top:10px;color:var(--faint)}
.search .inp{padding-left:34px;min-width:220px}

/* ---------- Table ---------- */
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.sel td{background:var(--brand-50)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:6px}

/* ---------- Badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.b.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.b.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.b.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.b.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.b.brand{background:var(--brand-50);color:var(--brand-700);border-color:transparent}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab.on{color:var(--brand-700);border-bottom-color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(6,18,12,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(720px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid var(--border)}
.modal.wide{width:min(1060px,100%)}.modal.narrow{width:min(460px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--text);color:var(--bg);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;gap:9px;align-items:flex-start;animation:fade .2s}
.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--brand);color:#fff}

/* ---------- Zoom viewer ---------- */
.zoom{position:fixed;inset:0;background:rgba(2,8,5,.92);z-index:300;display:flex;flex-direction:column}
.zoom-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff;padding-top:calc(10px + env(safe-area-inset-top))}
.zoom-bar .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.zoom-stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab}
.zoom-stage img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none}
.zoom-lvl{color:#cfe;font-size:12px;min-width:46px;text-align:center}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(1200px 600px at 10% 10%,#1e7a45 0,#0f4d2b 45%,#0a2e1b 100%);color:#e8f5ec;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;inset:auto -120px -160px auto;width:520px;height:520px;border-radius:50%;background:repeating-radial-gradient(circle at center,rgba(255,255,255,.06) 0 2px,transparent 2px 22px)}
.login-art h1{font-size:34px;line-height:1.15;margin:16px 0 12px;letter-spacing:-.02em}
.login-art p{color:#bfe0cb;max-width:460px}
.strata{display:flex;flex-direction:column;gap:0;border-radius:12px;overflow:hidden;max-width:380px;margin-top:26px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.strata div{padding:8px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--surface)}
.login-card{width:min(400px,100%)}
.login-card h2{margin:18px 0 4px;font-size:22px}
.login-foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.login-foot a{cursor:pointer;color:var(--brand-600);text-decoration:none;font-weight:600}

/* ---------- Charts ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:6px}
.prog{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.svgchart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.svgchart .gridl{stroke:var(--border)}

/* ---------- Map ---------- */
.mapwrap{display:grid;grid-template-columns:300px 1fr;gap:14px;min-height:640px}
.map{height:100%;min-height:600px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;z-index:1}
.mappanel{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 140px);overflow:auto}
.coord{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(255,255,255,.92);color:#123;padding:5px 9px;border-radius:8px;font:11px var(--mono);box-shadow:var(--shadow)}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content{font-size:12.5px;margin:10px 12px}
.lyr{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.lyr input[type=range]{width:90px}

/* ---------- Profile column ---------- */
.pedon{display:flex;gap:12px}
.pedon-col{width:110px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none}
.pedon-col div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6);border-bottom:1px dashed rgba(255,255,255,.35)}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;border:1px solid var(--border)}
.qr svg,.qr img{display:block}
.doc{max-width:820px;line-height:1.7}
.doc h2{font-size:18px;margin:22px 0 8px}.doc h3{font-size:15px;margin:18px 0 6px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:500}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}
.drop{border:2px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--brand);background:var(--brand-50)}
.spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:500}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hdr-scope select{max-width:160px}}
@media (max-width:980px){
  .side{position:fixed;left:0;top:0;height:100vh;z-index:90;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-lg);padding-top:calc(12px + env(safe-area-inset-top))}
  .side.open{transform:none}
  .drawer-mask.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
  main{padding:16px 14px calc(86px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 2px;border-radius:10px;cursor:pointer;min-height:48px}
  .bnav button.on{color:var(--brand-700);background:var(--brand-50)}
  .mapwrap{grid-template-columns:1fr}
  .mapwrap>div:last-child{order:-1}
  .map{min-height:62vh}
  .mappanel{max-height:none}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .login{grid-template-columns:1fr}
  .login-art{padding:28px 22px;min-height:auto}
  .login-art h1{font-size:24px}
  .strata{display:none}
  .hdr-scope{display:none}
  .user-chip .txt{display:none}
  .user-chip{padding:3px}
}
@media (min-width:981px){.only-m{display:none!important}}
@media (max-width:640px){
  .hide-xs{display:none!important}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid,.fgrid.c3{grid-template-columns:minmax(0,1fr)}
  .mask{padding:0;align-items:flex-end}
  .modal,.modal.wide,.modal.narrow{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .modal-f{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .page-h h1{font-size:18px}
  .kpi{padding:12px}.kpi .v{font-size:18px}.kpi .ic{width:34px;height:34px}
  .search .inp{min-width:0}
  .search{flex:1 1 100%}
  .bar-row{grid-template-columns:90px 1fr 52px}
  .net span{display:none}
  .brand-sub{max-width:44vw}
  .kv{grid-template-columns:120px 1fr}
  table.t{font-size:12.5px;min-width:640px}
  .modal table.t{min-width:0}
}
@media print{
  .hdr,.side,.bnav,.toolbar,.btns,.no-print{display:none!important}
  main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

<h2>1. Para pihak & penerimaan</h2><p>Syarat & Ketentuan ini mengatur penggunaan perangkat lunak <b>Soil Database Enterprise — Kelapa Sawit</b> ("Aplikasi") yang disediakan oleh ${esc(PROVIDER.name)} ("Penyedia") kepada perusahaan/organisasi pemegang lisensi ("Pelanggan") beserta pengguna yang diberi akun oleh Pelanggan ("Pengguna"). Dengan memasang, masuk, atau menggunakan Aplikasi, Anda menyetujui ketentuan ini. Bila Anda menggunakan Aplikasi atas nama perusahaan, Anda menyatakan berwenang mengikat perusahaan tersebut.</p>
<h2>2. Lisensi</h2><ul><li>Penyedia memberikan lisensi <b>non-eksklusif, tidak dapat dialihkan, dan tidak dapat disublisensikan</b> untuk menggunakan Aplikasi selama masa berlaku sesuai paket yang dibeli (Starter, Professional, Enterprise).</li><li>Setiap kunci lisensi <b>terikat pada satu basis data (Spreadsheet ID)</b> dan membatasi jumlah pengguna aktif, PT, dan kebun sesuai paket. Pengikatan perangkat (1 pengguna = 1 perangkat) dapat diterapkan; reset perangkat dilakukan oleh administrator Pelanggan.</li><li>Masa uji coba (trial) <b>14 hari</b> sejak instalasi dengan batas fitur tertentu. Setelah trial/lisensi berakhir, Aplikasi berjalan dalam <b>mode baca-saja</b>; data Pelanggan tetap utuh dan dapat diekspor oleh administrator melalui Google Sheets.</li></ul>
<h2>3. Larangan</h2><ul><li>Menyalin, mendistribusikan, menjual kembali, menyewakan, atau menerbitkan Aplikasi atau bagiannya kepada pihak ketiga tanpa izin tertulis.</li><li>Memodifikasi, merekayasa balik, menghapus atau mengakali mekanisme lisensi, atribusi, maupun pemberitahuan hak cipta.</li><li>Menggunakan Aplikasi untuk kegiatan melanggar hukum, termasuk pemrosesan data pribadi tanpa dasar hukum yang sah.</li></ul>
<h2>4. Data Pelanggan</h2><ul><li>Seluruh data yang dimasukkan (data kebun, blok, survei, hasil laboratorium, foto, akun pengguna) <b>tetap milik Pelanggan</b> dan disimpan di Google Sheets/Google Apps Script pada <b>akun Google milik Pelanggan</b>. Penyedia tidak memiliki akses kecuali diberi akses secara eksplisit untuk dukungan teknis.</li><li>Pelanggan bertanggung jawab atas keakuratan data, pengelolaan akun & hak akses, pencadangan berkala, serta kepatuhan terhadap ketentuan layanan Google.</li></ul>
<h2>5. Hasil analisis & rekomendasi</h2><p>Klasifikasi hara, kesesuaian lahan, diagnosis, dan simulasi dosis/biaya pupuk dalam Aplikasi bersifat <b>indikatif</b> dan dihitung dari data yang dimasukkan Pelanggan serta kriteria acuan publik (mis. Balai Penelitian Tanah). Hasil tersebut <b>bukan</b> nasihat agronomis, hukum, atau investasi profesional dan wajib divalidasi oleh ahli sebelum dijadikan dasar keputusan operasional/pengadaan. Status akreditasi hasil uji laboratorium sepenuhnya mengikuti dokumen resmi laboratorium; Aplikasi tidak menerbitkan sertifikat akreditasi.</p>
<h2>6. Layanan pihak ketiga</h2><p>Aplikasi memanfaatkan Google Workspace/Apps Script, GitHub Pages (opsional), CDN pustaka sumber terbuka, serta penyedia peta dasar (OpenStreetMap, Esri, OpenTopoMap atau penyedia pilihan Pelanggan). Ketersediaan, kuota, dan ketentuan layanan tersebut berada di luar kendali Penyedia. Penggunaan peta dasar untuk tujuan komersial bervolume tinggi dapat memerlukan lisensi terpisah dari penyedia peta.</p>
<h2>7. Pembaruan & dukungan</h2><p>Penyedia dapat merilis pembaruan perbaikan bug dan fitur. Cakupan dukungan, waktu respons, dan pembaruan mayor mengikuti paket/kontrak berlangganan. Pelanggan disarankan membuat cadangan sebelum memasang pembaruan.</p>
<h2>8. Jaminan & batas tanggung jawab</h2><p>Aplikasi disediakan "sebagaimana adanya" sesuai dokumentasi. Sejauh diizinkan hukum, Penyedia tidak bertanggung jawab atas kerugian tidak langsung, kehilangan keuntungan, kehilangan data akibat kelalaian pengelolaan akun/cadangan, atau gangguan layanan pihak ketiga. Total tanggung jawab Penyedia dibatasi maksimal sebesar biaya lisensi yang dibayarkan Pelanggan dalam 12 bulan terakhir.</p>
<h2>9. Pengakhiran</h2><p>Lisensi berakhir otomatis bila masa berlaku habis atau Pelanggan melanggar ketentuan ini dan tidak memperbaikinya dalam 14 hari setelah pemberitahuan. Data Pelanggan tetap berada di akun Google Pelanggan.</p>
<h2>10. Hukum yang berlaku</h2><p>Ketentuan ini diatur oleh hukum Republik Indonesia. Sengketa diselesaikan secara musyawarah; bila tidak tercapai, melalui pengadilan negeri di wilayah domisili Penyedia, kecuali disepakati lain secara tertulis.</p>
<h2>11. Kontak</h2><p>${esc(PROVIDER.name)} · ${esc(PROVIDER.city)} · ${esc(PROVIDER.contact)}</p>`},privacy:{title:"Pemberitahuan Privasi",html:`
<p class="muted">Berlaku sejak: 29 Oktober 2026 · disusun dengan mengacu pada UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi (UU PDP)</p>
<h2>1. Peran para pihak</h2><p><b>Perusahaan pemegang lisensi</b> (pemberi akun Anda) adalah <b>Pengendali Data Pribadi</b> atas data yang diproses di Aplikasi. Data disimpan pada Google Sheets/Apps Script milik perusahaan tersebut. Penyedia Aplikasi tidak menerima salinan data, kecuali bertindak sebagai <b>Prosesor</b> saat diberi akses untuk dukungan teknis berdasarkan perjanjian.</p>
<h2>2. Data pribadi yang diproses</h2><ul><li><b>Data akun</b>: nama, username, email, nomor HP, departemen, peran, lingkup PT/kebun, foto profil (opsional), hash kata sandi (kata sandi asli tidak disimpan).</li><li><b>Data aktivitas</b>: waktu login/keluar, jejak audit perubahan data (siapa, kapan, apa), jenis klien (web/PWA).</li><li><b>Identitas perangkat</b>: ID perangkat acak yang dibuat aplikasi untuk penegakan lisensi "1 pengguna = 1 perangkat".</li><li><b>Lokasi</b>: koordinat GPS hanya diambil <b>saat Anda menekan tombol GPS</b> untuk mencatat titik sampel/profil atau menampilkan posisi di peta. Aplikasi tidak melacak lokasi di latar belakang; koordinat titik sampel disimpan sebagai data kerja perusahaan.</li><li><b>Foto lapangan/profil tanah, logo & foto profil</b> yang Anda unggah (dikompres lalu disimpan di folder Google Drive milik perusahaan; berkas dibagikan "siapa saja yang memiliki link" agar dapat ditampilkan cepat — atau privat bila kebijakan Workspace melarang), yang mungkin secara tidak sengaja memuat orang — hindari memotret wajah tanpa persetujuan.</li><li>Data operasional (kebun, blok, hasil lab) umumnya bukan data pribadi, kecuali nama petugas/surveyor/analis.</li></ul>
<h2>3. Tujuan & dasar pemrosesan</h2><p>Autentikasi & keamanan akun, pengendalian hak akses (RBAC), ketertelusuran data (audit) untuk tata kelola mutu, operasional survei & laboratorium, penegakan lisensi, dan dukungan teknis. Dasar pemrosesan: pelaksanaan perjanjian kerja/kontrak dan kepentingan yang sah perusahaan dalam mengelola data operasionalnya, serta persetujuan untuk data opsional (foto profil).</p>
<h2>4. Penyimpanan di perangkat</h2><p>Agar dapat bekerja offline, Aplikasi menyimpan salinan data sesuai lingkup akses Anda, antrean sinkronisasi, gambar, berkas foto udara PMTiles, dan verifikator kata sandi (hash, bukan kata sandi asli) di penyimpanan browser perangkat (IndexedDB/OPFS/localStorage). Gunakan kunci layar perangkat, jangan berbagi perangkat, dan hapus cache melalui <i>Pengaturan › Offline</i> bila perangkat akan dialihkan.</p>
<h2>5. Pihak ketiga</h2><ul><li><b>Google LLC</b> (Google Sheets, Apps Script) sebagai penyedia infrastruktur akun perusahaan.</li><li><b>GitHub Pages</b> (bila PWA digunakan) untuk menyajikan berkas aplikasi statis — tidak menyimpan data Anda.</li><li><b>CDN pustaka</b> (cdnjs, unpkg, cdn.sheetjs.com) dan <b>penyedia peta dasar</b> (OpenStreetMap, Esri, OpenTopoMap atau penyedia yang dipilih perusahaan) menerima permintaan teknis standar (alamat IP, agen pengguna, ubin peta yang diminta).</li><li>Tautan "Kirim via WhatsApp" hanya membuka aplikasi WhatsApp dengan teks yang Anda kirim sendiri.</li></ul>
<h2>6. Retensi</h2><p>Data akun disimpan selama akun aktif dan dapat dinonaktifkan oleh administrator. Jejak audit disimpan sesuai kebijakan retensi perusahaan untuk keperluan tata kelola dan dapat diarsipkan. Cache perangkat dihapus saat Anda menghapus cache atau data situs browser.</p>
<h2>7. Keamanan</h2><p>Kata sandi di-hash dengan salt, kunci percobaan login, sesi berbatas waktu, kontrol akses per peran dan lingkup PT/kebun ditegakkan di server, serta pencegahan injeksi formula pada Sheets. Keamanan akun Google perusahaan (2FA, pembatasan berbagi spreadsheet) merupakan tanggung jawab administrator perusahaan.</p>
<h2>8. Hak Anda sebagai subjek data</h2><p>Sesuai UU PDP, Anda berhak memperoleh informasi, mengakses, memperbaiki, memperbarui, meminta penghapusan atau pembatasan pemrosesan data pribadi Anda, menarik persetujuan untuk data opsional, serta mengajukan keberatan. Ajukan permintaan kepada administrator/Pejabat Pelindungan Data perusahaan Anda. Anda dapat memperbarui profil & foto sendiri melalui menu <i>Profil saya</i>.</p>
<h2>9. Insiden</h2><p>Bila terjadi kegagalan pelindungan data pribadi, perusahaan sebagai Pengendali akan melakukan pemberitahuan sesuai ketentuan UU PDP; Penyedia akan membantu investigasi teknis sesuai perjanjian.</p>
<h2>10. Perubahan & kontak</h2><p>Pemberitahuan ini dapat diperbarui bersama rilis aplikasi. Pertanyaan teknis tentang aplikasi: ${esc(PROVIDER.contact)}.</p>`},oss:{title:"Lisensi Pihak Ketiga",html:`
